name: Prepare reels

# Showreels listed in public/reels/drive.txt (a Google Drive file ID and a name per line,
# shared with "Anyone with the link") are downloaded and made into MP4s that every browser
# streams, sound kept, with a still for each (scripts/prepare-reels.mjs).
# The result is committed to this branch, then the preview is republished.

on:
  push:
    branches: ['claude/shez-manzoor-stage-design']
    paths: ['public/reels/drive.txt', 'scripts/prepare-reels.mjs', '.github/workflows/prepare-reels.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-reels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg)
      - name: Download and prepare
        run: node scripts/prepare-reels.mjs
      - name: Save to the branch
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/reels
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Prepare the showreels"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # commits made by this job do not start other workflows, so ask main to republish the previews
      - name: Republish the preview
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
